<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You Party Heart</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030308;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initWords();
    }
    window.addEventListener('resize', resize);

    // มีเฉพาะคำว่า Love You และ Party เท่านั้น
    const messages = ["Love You", "Party", "Love You Party", "Party ❤️", "Love You ❤️"];

    const colors = [
        "#ffb4c8", "#ff6496", "#e6325a", "#ffffff", "#ff80aa", "#ffcccc"
    ];

    let words = [];
    let centerX, centerY, baseScale;

    function getHeartPoint(t) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        return {x, y};
    }

    function initWords() {
        words = [];
        centerX = window.innerWidth / 2;
        centerY = window.innerHeight / 2;
        
        baseScale = Math.min(window.innerWidth, window.innerHeight) / 34;

        // 1. สร้างขอบรูปหัวใจให้คมชัด
        const edgeCount = 140;
        for (let i = 0; i < edgeCount; i++) {
            let t = (i / edgeCount) * Math.PI * 2;
            let p = getHeartPoint(t);
            words.push({
                text: messages[i % messages.length],
                x: p.x,
                y: p.y,
                size: Math.floor(Math.random() * 4) + 13,
                color: colors[i % colors.length],
                alpha: 0.95
            });
        }

        // 2. เติมข้อความภายในรูปหัวใจให้แน่นและเต็มพื้นที่
        const innerCount = 300;
        for (let i = 0; i < innerCount; i++) {
            let t = Math.random() * Math.PI * 2;
            let p = getHeartPoint(t);
            
            let r = Math.pow(Math.random(), 0.65); 
            let rx = p.x * r;
            let ry = p.y * r;

            // เว้นระยะตรงกลางให้ชื่อ PARTY ❤️ โดดเด่น
            if (Math.abs(rx) < 4.2 && Math.abs(ry) < 3.2) {
                rx *= 1.35;
                ry *= 1.35;
            }

            words.push({
                text: messages[Math.floor(Math.random() * messages.length)],
                x: rx,
                y: ry,
                size: Math.floor(Math.random() * 6) + 12,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 0.7 + Math.random() * 0.3
            });
        }
    }

    let time = 0;

    function animate() {
        ctx.fillStyle = "rgba(3, 3, 8, 0.35)";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        time += 0.035;

        // จังหวะหัวใจเต้นขยายและหดอย่างนุ่มนวล
        let pulse = 1.0 + 0.065 * Math.sin(time) + 0.02 * Math.sin(time * 2.3);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        words.forEach(w => {
            let textScale = 0.95 + 0.05 * pulse; 
            ctx.font = `${w.size * textScale}px 'Segoe UI', Roboto, Arial, sans-serif`;
            
            let rgb = hexToRgb(w.color);
            ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${w.alpha})`;
            
            let px = centerX + (w.x * baseScale * pulse);
            let py = centerY + (w.y * baseScale * pulse);
            
            ctx.fillText(w.text, px, py);
        });

        // ชื่อ PARTY ❤️ ตรงกลางขนาดใหญ่เด่นชัด
        let partyBaseSize = Math.min(window.innerWidth, window.innerHeight) * 0.11;
        let partyPulse = 1.0 + 0.08 * Math.sin(time) + 0.025 * Math.sin(time * 2.3);
        
        ctx.font = `bold ${partyBaseSize * partyPulse}px 'Segoe UI', Roboto, Arial, sans-serif`;
        
        ctx.shadowColor = "rgba(255, 40, 100, 0.85)";
        ctx.shadowBlur = 28 * partyPulse;
        
        ctx.fillStyle = "#ff2864";
        ctx.fillText("PARTY ❤️", centerX, centerY);

        ctx.shadowBlur = 0;

        requestAnimationFrame(animate);
    }

    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : {r: 255, g: 255, b: 255};
    }

    resize();
    animate();
</script>

</body>
</html>
